<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduling Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Poppins:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Raleway:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --scheduler-bg:      #ffffff;
      --scheduler-text:    #0e0e0e;
      --scheduler-accent:  #313131;
      --scheduler-header:  #000000;
      --scheduler-border:  rgba(14,14,14,0.12);
      --scheduler-font:    'Source Sans Pro', sans-serif;
    }

    body {
      font-family: var(--scheduler-font);
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .page-wrap {
      width: 100%;
      max-width: 480px;
      background: var(--scheduler-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────── */

    .sched-header {
      background: var(--scheduler-header);
      padding: 24px 24px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    .acuity-nav {
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: right;
      gap: 4px;
    }

    .acuity-nav-link {
      font-family: var(--scheduler-font);
      font-size: 12px;
      font-weight: 600;
      color: var(--scheduler-accent);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 8px;
    }

    .sched-business-name {
      font-family: var(--scheduler-font);
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .sched-hours {
      font-family: var(--scheduler-font);
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      text-align: center;
    }

    /* ── Nav ────────────────────────────────────────── */
    .sched-nav {
      background: var(--scheduler-bg);
      padding: 32px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .sched-nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
    }

    .sched-nav-title {
      font-family: var(--scheduler-font);
      font-size: 16px;
      font-weight: 700;
      color: var(--scheduler-text);
      letter-spacing: 0.3px;
      text-align: center;
    }

    /* ── Appointment list ───────────────────────────── */
    .sched-list {
      flex: inherit;
      display: flex;
      flex-direction: column;
      padding: 0;
      margin: 0 16px;
      box-shadow: rgba(0, 0, 0, 0.12) 0px 2px 8px 0px, rgba(0, 0, 0, 0.08) 0px 0px 1px 0px;
    }

    .sched-card {
      border-bottom: 1px solid var(--scheduler-border);
      background: var(--scheduler-bg);
    }
    .sched-card:last-child { border-bottom: none; }

    .sched-card-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      display: block;
    }

    .sched-card-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sched-card-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .sched-card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sched-card-name {
      font-family: var(--scheduler-font);
      font-size: 16px;
      font-weight: 600;
      color: var(--scheduler-accent);
      line-height: 1.3;
    }

    .sched-card-meta {
      font-family: var(--scheduler-font);
      font-size: 14px;
      font-weight: 400;
      color: var(--scheduler-text);
      opacity: 0.7;
    }

    .sched-card-desc {
      font-family: var(--scheduler-font);
      font-size: 14px;
      font-weight: 400;
      color: var(--scheduler-text);
      line-height: 1.6;
      opacity: 0.85;
    }

    .sched-book-btn {
      align-self: flex-start;
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--scheduler-accent);
      color: #ffffff;
      border: none;
      font-family: var(--scheduler-font);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.75px;
      text-transform: uppercase;
      cursor: default;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── Footer ─────────────────────────────────────── */
    .sched-footer {
      padding: 32px 22px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .sched-footer-link {
      font-family: var(--scheduler-font);
      font-size: 12px;
      font-weight: 600;
      color: var(--scheduler-text);
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
    }

    .sched-powered {
      font-family: 'Clarkson', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      color: var(--scheduler-text);
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="page-wrap" id="page-wrap">

    <header class="sched-header" id="sched-header">
      <div class="acuity-nav">
        <a href="#" class="acuity-nav-link">
          Sign up
        </a>
        <a href="#" class="acuity-nav-link">
          Log in
        </a>
      </div>
      <p class="sched-business-name" id="sched-business-name">Your Site Title</p>
    </header>

    <div class="sched-nav">
      <span class="sched-nav-icon"><img src="assets/csp-icon-calendar.svg" alt="" style="width: 20px; height: 20px;"></span><span class="sched-nav-title">Select Appointment</span>
    </div>

    <div class="sched-list" id="sched-list">
    </div>

    <footer class="sched-footer">
      <a class="sched-footer-link" href="#">Check code balance</a>
      <span class="sched-powered">Powered by Acuity Scheduling</span>
    </footer>

  </div>

  <script>
    (function() {
      const params = new URLSearchParams(location.search);

      let services = [];
      let hours    = '';
      let palette  = ['#ffffff','#e0e0e0','#9e9e9e','#424242','#000000'];
      let font     = "'Source Sans Pro', sans-serif";

      try { services = JSON.parse(params.get('services') || '[]'); } catch(e) {}
      try { palette  = JSON.parse(params.get('palette')  || '[]') || palette; } catch(e) {}
      hours = params.get('hours') || '';
      font  = params.get('font')  || font;
      const darkMode = params.get('dark') === '1';

      const businessName = params.get('businessName') || '';
      if (businessName) {
        const bizEl = document.getElementById('sched-business-name');
        if (bizEl) bizEl.textContent = businessName;
      }

      // Apply CSS vars — dark mode swaps palette roles
      const root = document.documentElement;
      const bg     = darkMode ? (palette[4] || '#000000') : (palette[0] || '#ffffff');
      const hdrBg  = darkMode ? (palette[3] || '#424242') : (palette[4] || '#000000');
      const accent = darkMode ? (palette[1] || '#e0e0e0') : (palette[2] || '#313131');
      root.style.setProperty('--scheduler-bg',     bg);
      root.style.setProperty('--scheduler-accent',  accent);
      root.style.setProperty('--scheduler-header',  hdrBg);
      root.style.setProperty('--scheduler-font',    font);

      // Compute header text color
      function isDark(hex) {
        if (!hex || hex[0] !== '#') return false;
        const r = parseInt(hex.slice(1,3),16),
              g = parseInt(hex.slice(3,5),16),
              b = parseInt(hex.slice(5,7),16);
        return (0.299*r + 0.587*g + 0.114*b) < 128;
      }

      // Page text color based on background
      const pageTextColor = isDark(bg) ? '#ffffff' : '#0e0e0e';
      root.style.setProperty('--scheduler-text', pageTextColor);
      root.style.setProperty('--scheduler-border',
        isDark(bg) ? 'rgba(255,255,255,0.12)' : 'rgba(14,14,14,0.12)');

      const headerEl = document.querySelector('.sched-header');
      if (headerEl) {
        const hdrTextColor = isDark(hdrBg) ? '#ffffff' : '#0e0e0e';
        headerEl.style.color = hdrTextColor;
        document.querySelectorAll('.sched-business-name, .sched-hours').forEach(el => {
          el.style.color = hdrTextColor;
          if (el.classList.contains('sched-hours')) el.style.opacity = '0.75';
        });
      }

      // Book button text color
      const btnTextColor = isDark(accent) ? '#ffffff' : '#0e0e0e';
      root.style.setProperty('--sched-btn-text', btnTextColor);

      // Populate hours
      const hoursEl = document.getElementById('sched-hours');
      if (hoursEl && hours) hoursEl.textContent = hours;

      // Render appointment cards
      const list = document.getElementById('sched-list');
      if (!list) return;

      if (!services.length) {
        list.innerHTML = '<div style="padding:40px 22px;text-align:center;opacity:0.4;font-size:14px;">No services to display.</div>';
        return;
      }

      list.innerHTML = services.map(svc => {
        const imgHtml  = svc.image
          ? `<img class="sched-card-img" src="${svc.image}" alt="">`
          : '';
        const descHtml = svc.description
          ? `<p class="sched-card-desc">${svc.description}</p>`
          : '';
        return `
          <div class="sched-card">
            ${imgHtml}
            <div class="sched-card-body">
              <div class="sched-card-top">
                <div class="sched-card-info">
                  <span class="sched-card-name" style="font-family:${font};color:${accent}">${svc.name}</span>
                  <span class="sched-card-meta" style="font-family:${font}">${svc.duration} @ ${svc.price}</span>
                </div>
                <button class="sched-book-btn" style="font-family:${font};background:${accent};color:${btnTextColor}">BOOK</button>
              </div>
              ${descHtml}
            </div>
          </div>`;
      }).join('');

      // Apply font to all text elements
      document.querySelectorAll('.sched-card-desc, .sched-nav-title').forEach(el => {
        el.style.fontFamily = font;
      });
    })();
  </script>
</body>
</html>
